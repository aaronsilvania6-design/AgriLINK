<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriLink AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --red:#c62828;
  --red2:#d32f2f;
  --light:#f6f7f8;
  --white:#fff;
  --border:#e5e5e5;
  --text:#202124;
  --muted:#777;
  --green:#2e7d32;
  --blue:#1976d2;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= AUTH ================= */

.auth-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:var(--shadow);
}

.logo{
  width:68px;
  height:68px;
  border-radius:20px;
  background:var(--red);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  margin:auto;
}

.brand{
  text-align:center;
  color:var(--red);
  margin-top:12px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin:7px 0 25px;
}

.tabs{
  display:flex;
  background:#f1f1f1;
  padding:4px;
  border-radius:12px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  border:none;
  padding:11px;
  border-radius:9px;
  background:transparent;
  font-weight:bold;
}

.tab.active{
  background:white;
  color:var(--red);
}

label{
  display:block;
  margin:14px 0 6px;
  font-size:13px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  outline:none;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--red);
}

.primary-btn{
  width:100%;
  border:none;
  background:var(--red);
  color:white;
  padding:14px;
  border-radius:11px;
  font-weight:bold;
  margin-top:20px;
}

.primary-btn:hover{
  background:var(--red2);
}

.secondary-btn{
  border:none;
  background:#eeeeee;
  padding:11px 15px;
  border-radius:10px;
}

.danger-btn{
  border:none;
  background:#222;
  color:white;
  padding:11px 15px;
  border-radius:10px;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  font-size:14px;
}

.success{
  background:#e8f5e9;
  color:#1b5e20;
}

.error{
  background:#ffebee;
  color:#b71c1c;
}

/* ================= NAVBAR ================= */

.navbar{
  background:white;
  border-bottom:1px solid var(--border);
  padding:13px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.nav-brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:bold;
  color:var(--red);
  font-size:19px;
}

.nav-logo{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--red);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

/* ================= MAIN ================= */

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:25px 20px 50px;
}

.welcome{
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:white;
  padding:28px;
  border-radius:20px;
  margin-bottom:25px;
}

.welcome h1{
  margin-bottom:7px;
}

.role-badge{
  display:inline-block;
  margin-top:10px;
  background:rgba(255,255,255,.18);
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

.section{
  margin-bottom:30px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  gap:10px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:17px;
}

.product-card{
  background:white;
  border-radius:17px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 5px 15px rgba(0,0,0,.03);
}

.product-image{
  width:100%;
  height:170px;
  background:#eeeeee;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-placeholder{
  font-size:50px;
}

.product-content{
  padding:16px;
}

.product-content h3{
  margin-bottom:8px;
}

.price{
  color:var(--red);
  font-size:19px;
  font-weight:bold;
  margin-bottom:7px;
}

.product-description{
  color:#555;
  font-size:14px;
  margin-bottom:8px;
  line-height:1.4;
}

.product-location{
  color:var(--muted);
  font-size:13px;
  margin-bottom:13px;
}

.product-actions{
  display:flex;
  gap:7px;
}

.product-actions button{
  flex:1;
  border:none;
  padding:10px;
  border-radius:9px;
  font-weight:bold;
}

.chat-btn{
  background:#eeeeee;
}

.buy-btn{
  background:var(--red);
  color:white;
}

.empty{
  background:white;
  border:1px dashed #ccc;
  padding:40px 20px;
  border-radius:16px;
  text-align:center;
  color:var(--muted);
}

/* ================= ORDERS ================= */

.orders{
  display:grid;
  gap:12px;
}

.order-card{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.order-status{
  padding:5px 9px;
  border-radius:20px;
  background:#eeeeee;
  font-size:12px;
  font-weight:bold;
}

.order-info{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

.order-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.order-actions button{
  border:none;
  padding:9px 12px;
  border-radius:9px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:100;
}

.modal-card{
  width:100%;
  max-width:520px;
  background:white;
  border-radius:20px;
  padding:25px;
  max-height:90vh;
  overflow-y:auto;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.close{
  border:none;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:18px;
}

/* ================= CHAT ================= */

.chat-modal .modal-card{
  max-width:850px;
  padding:0;
  overflow:hidden;
}

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  height:75vh;
  min-height:500px;
}

.conversation-list{
  border-right:1px solid var(--border);
  background:#fafafa;
  overflow-y:auto;
}

.chat-list-header{
  padding:17px;
  border-bottom:1px solid var(--border);
  font-weight:bold;
}

.conversation-item{
  padding:14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.conversation-item:hover,
.conversation-item.active{
  background:white;
}

.conversation-name{
  font-weight:bold;
}

.conversation-preview{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-user{
  font-weight:bold;
}

.online{
  color:var(--green);
  font-size:12px;
}

.chat-messages{
  flex:1;
  padding:18px;
  overflow-y:auto;
  background:#f8f8f8;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message-row{
  display:flex;
}

.message-row.mine{
  justify-content:flex-end;
}

.chat-bubble{
  max-width:75%;
  padding:10px 13px;
  border-radius:15px;
  background:white;
  border:1px solid var(--border);
  position:relative;
}

.message-row.mine .chat-bubble{
  background:#ffebee;
  border-color:#ffcdd2;
}

.chat-time{
  font-size:10px;
  color:#999;
  margin-top:4px;
}

.message-delete{
  border:none;
  background:transparent;
  color:#999;
  font-size:11px;
  margin-left:6px;
}

.chat-input{
  padding:12px;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
  background:white;
}

.chat-input input{
  flex:1;
}

.chat-input button{
  border:none;
  background:var(--red);
  color:white;
  padding:0 18px;
  border-radius:10px;
}

.chat-empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
  padding:20px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

  .chat-layout{
    grid-template-columns:1fr;
  }

  .conversation-list{
    display:none;
  }

  .chat-modal .modal-card{
    max-width:100%;
  }

  .chat-layout{
    height:85vh;
  }
}

@media(max-width:600px){

  .auth-card{
    padding:22px;
  }

  .navbar{
    padding:11px;
  }

  .nav-brand{
    font-size:16px;
  }

  .nav-logo{
    width:36px;
    height:36px;
  }

  .nav-actions{
    gap:5px;
  }

  .nav-actions button{
    padding:9px;
    font-size:12px;
  }

  .container{
    padding:17px 12px 40px;
  }

  .welcome{
    padding:21px;
    border-radius:16px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image{
    height:120px;
  }

  .product-content{
    padding:11px;
  }

  .product-content h3{
    font-size:15px;
  }

  .price{
    font-size:16px;
  }

  .product-description{
    font-size:12px;
  }

  .product-actions{
    flex-direction:column;
  }

  .modal{
    padding:8px;
  }

  .modal-card{
    padding:18px;
    border-radius:16px;
  }

  .chat-modal{
    padding:0;
  }

  .chat-modal .modal-card{
    border-radius:0;
    height:100vh;
    max-height:100vh;
  }

  .chat-layout{
    height:100vh;
  }

  .chat-bubble{
    max-width:85%;
  }
}

@media(min-width:1400px){

  .container{
    max-width:1350px;
  }

  .products{
    grid-template-columns:repeat(5,1fr);
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-container">

<div class="auth-card">

<div class="logo">🌾</div>

<h1 class="brand">AgriLink AI</h1>

<p class="subtitle">
Connect. Trade. Grow.
</p>

<div class="tabs">

<button id="loginTab"
class="tab active"
onclick="showLogin()">
Login
</button>

<button id="signupTab"
class="tab"
onclick="showSignup()">
Sign Up
</button>

</div>

<form id="loginForm">

<label>Email</label>

<input
id="loginEmail"
type="email"
required
placeholder="you@example.com">

<label>Password</label>

<input
id="loginPassword"
type="password"
required
placeholder="Your password">

<button class="primary-btn">
Login
</button>

</form>

<form id="signupForm" class="hidden">

<label>Full Name</label>

<input
id="signupName"
required
placeholder="Juan Dela Cruz">

<label>Email</label>

<input
id="signupEmail"
type="email"
required
placeholder="you@example.com">

<label>Password</label>

<input
id="signupPassword"
type="password"
minlength="8"
required
placeholder="Minimum 8 characters">

<label>Account Type</label>

<select id="signupRole">

<option value="BUYER">Buyer</option>
<option value="FARMER">Farmer</option>
<option value="ORGANIZATION">Organization</option>

</select>

<button class="primary-btn">
Create Account
</button>

</form>

<div id="authMessage"></div>

</div>
</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

<nav class="navbar">

<div class="nav-brand">
<div class="nav-logo">🌾</div>
AgriLink AI
</div>

<div class="nav-actions">

<button
class="secondary-btn"
onclick="openChat()">
💬 Chat
</button>

<button
id="addProductButton"
class="secondary-btn"
onclick="openAddProduct()">
+ Product
</button>

<button
class="danger-btn"
onclick="logout()">
Logout
</button>

</div>

</nav>


<main class="container">

<section class="welcome">

<h1>
Welcome, <span id="userName">User</span>!
</h1>

<p>
Your agricultural marketplace.
</p>

<div id="roleBadge"
class="role-badge">
</div>

</section>


<section class="section">

<div class="section-title">

<h2>Marketplace</h2>

<button
class="secondary-btn"
onclick="loadProducts()">
Refresh
</button>

</div>

<div id="products"
class="products">
</div>

</section>


<section class="section">

<div class="section-title">

<h2>My Orders</h2>

<button
class="secondary-btn"
onclick="loadOrders()">
Refresh
</button>

</div>

<div id="orders"
class="orders">
</div>

</section>

</main>
</div>


<!-- ================= ADD PRODUCT ================= -->

<div
id="productModal"
class="modal hidden">

<div class="modal-card">

<div class="modal-header">

<h2>Add Product</h2>

<button
class="close"
onclick="closeAddProduct()">
×
</button>

</div>

<form id="productForm">

<label>Product Name</label>

<input
id="productName"
required
placeholder="Fresh Tomatoes">

<label>Description</label>

<textarea
id="productDescription"
placeholder="Describe your product">
</textarea>

<label>Price</label>

<input
id="productPrice"
type="number"
min="0"
step="0.01"
required>

<label>Quantity</label>

<input
id="productQuantity"
type="number"
min="0"
step="0.01"
required>

<label>Unit</label>

<select id="productUnit">
<option value="kg">kg</option>
<option value="piece">piece</option>
<option value="sack">sack</option>
<option value="box">box</option>
<option value="dozen">dozen</option>
</select>

<label>Location</label>

<input
id="productLocation"
placeholder="Municipality / Province">

<label>Product Image</label>

<input
id="productImage"
type="file"
accept="image/*">

<button class="primary-btn">
Publish Product
</button>

<div id="productMessage"></div>

</form>

</div>
</div>


<!-- ================= CHAT ================= -->

<div
id="chatModal"
class="modal chat-modal hidden">

<div class="modal-card">

<div class="chat-layout">

<div class="conversation-list">

<div class="chat-list-header">
💬 Conversations
</div>

<div id="conversationList"></div>

</div>


<div class="chat-window">

<div class="chat-header">

<div>
<div id="chatUserName"
class="chat-user">
Select a conversation
</div>

<div class="online">
● AgriLink Chat
</div>
</div>

<button
class="close"
onclick="closeChat()">
×
</button>

</div>


<div
id="chatMessages"
class="chat-messages">

<div class="chat-empty">
Select a conversation to start chatting.
</div>

</div>


<form
id="chatForm"
class="chat-input">

<input
id="chatInput"
placeholder="Type a message..."
autocomplete="off">

<button>
Send
</button>

</form>

</div>

</div>

</div>
</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://ivbqudztsmsylnodydce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_J6ofqkb71svrAJr1-mvFIA_hy3RKHrM";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ================= GLOBALS ================= */

let currentUser=null;
let currentProfile=null;

let currentConversation=null;
let messageChannel=null;


/* ================= HELPERS ================= */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ================= AUTH TABS ================= */

function showLogin(){

document
.getElementById("loginForm")
.classList.remove("hidden");

document
.getElementById("signupForm")
.classList.add("hidden");

document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("signupTab")
.classList.remove("active");

}


function showSignup(){

document
.getElementById("loginForm")
.classList.add("hidden");

document
.getElementById("signupForm")
.classList.remove("hidden");

document
.getElementById("signupTab")
.classList.add("active");

document
.getElementById("loginTab")
.classList.remove("active");

}


/* ================= MESSAGE ================= */

function showAuthMessage(text,type){

const box=
document.getElementById("authMessage");

box.className=
"message "+type;

box.textContent=text;

}


/* ================= LOGIN ================= */

document
.getElementById("loginForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const email=
document
.getElementById("loginEmail")
.value.trim();

const password=
document
.getElementById("loginPassword")
.value;

const {data,error}=
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

showAuthMessage(error.message,"error");
return;

}

await initializeApp(data.user);

});


/* ================= SIGNUP ================= */

document
.getElementById("signupForm")
.addEventListener("submit",async e=>{

e.preventDefault();

const fullName=
document
.getElementById("signupName")
.value.trim();

const email=
document
.getElementById("signupEmail")
.value.trim();

const password=
document
.getElementById("signupPassword")
.value;

const role=
document
.getElementById("signupRole")
.value;

const {data,error}=
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:fullName,
role:role
}
}

});

if(error){

showAuthMessage(error.message,"error");
return;

}

showAuthMessage(
"Account created successfully. You can now log in.",
"success"
);

document
.getElementById("signupForm")
.reset();

});


/* ================= INITIALIZE ================= */

async function initializeApp(user){

currentUser=user;

const {data:profile,error}=
await supabaseClient
.from("users")
.select("*")
.eq("auth_user_id",user.id)
.single();

if(error){

console.error(error);

alert(
"Your AgriLink profile could not be loaded."
);

return;

}

currentProfile=profile;

document
.getElementById("authScreen")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

document
.getElementById("userName")
.textContent=
profile.full_name;

document
.getElementById("roleBadge")
.textContent=
profile.role;


const addButton=
document.getElementById("addProductButton");

if(profile.role!=="FARMER"){

addButton.classList.add("hidden");

}else{

addButton.classList.remove("hidden");

}

await loadProducts();
await loadOrders();

}


/* ================= PRODUCTS ================= */

async function loadProducts(){

const container=
document.getElementById("products");

container.innerHTML=
`<div class="empty">Loading products...</div>`;

const {data,error}=
await supabaseClient
.from("products")
.select(`
id,
name,
description,
price,
quantity,
unit,
location,
image_url,
status,
seller_id
`)
.eq("status","ACTIVE")
.gt("quantity",0)
.order("created_at",{ascending:false});

if(error){

console.error(error);

container.innerHTML=
`<div class="empty">
Unable to load products.<br>
${escapeHtml(error.message)}
</div>`;

return;

}

if(!data || data.length===0){

container.innerHTML=
`<div class="empty">
<h3>No products yet</h3>
<p>Be the first farmer to publish a product.</p>
</div>`;

return;

}


container.innerHTML=
data.map(product=>{

const image=
product.image_url
?
`<img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}">`
:
`<div class="product-placeholder">🌱</div>`;

return `

<div class="product-card">

<div class="product-image">
${image}
</div>

<div class="product-content">

<h3>
${escapeHtml(product.name)}
</h3>

<div class="price">
₱${Number(product.price).toLocaleString()}
 /
${escapeHtml(product.unit)}
</div>

<div class="product-description">
${escapeHtml(product.description || "No description")}
</div>

<div class="product-location">
📍 ${escapeHtml(product.location || "Location not specified")}
</div>

<div class="product-actions">

<button
class="chat-btn"
onclick="startChat('${product.seller_id}','${product.id}')">
💬 Chat
</button>

<button
class="buy-btn"
onclick="buyProduct('${product.id}')">
Buy
</button>

</div>

</div>
</div>

`;

}).join("");

}


/* ================= ADD PRODUCT ================= */

function openAddProduct(){

document
.getElementById("productModal")
.classList.remove("hidden");

}


function closeAddProduct(){

document
.getElementById("productModal")
.classList.add("hidden");

}


document
.getElementById("productForm")
.addEventListener("submit",async e=>{

e.preventDefault();

if(
!currentProfile ||
currentProfile.role!=="FARMER"
){

alert("Only farmers can publish products.");
return;

}


const message=
document.getElementById("productMessage");

message.innerHTML=
`<div class="message">Publishing...</div>`;


const file=
document.getElementById("productImage").files[0];

let imageUrl=null;


if(file){

const fileName=
`${currentUser.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;

const {error:uploadError}=
await supabaseClient.storage
.from("product-images")
.upload(fileName,file,{
upsert:false
});

if(uploadError){

message.innerHTML=
`<div class="message error">
${escapeHtml(uploadError.message)}
</div>`;

return;

}


const {data:urlData}=
supabaseClient.storage
.from("product-images")
.getPublicUrl(fileName);

imageUrl=urlData.publicUrl;

}


const product={

seller_id:currentProfile.id,

name:
document.getElementById("productName").value.trim(),

description:
document.getElementById("productDescription").value.trim(),

price:
Number(document.getElementById("productPrice").value),

quantity:
Number(document.getElementById("productQuantity").value),

unit:
document.getElementById("productUnit").value,

location:
document.getElementById("productLocation").value.trim(),

image_url:imageUrl,

status:"ACTIVE"

};


const {error}=
await supabaseClient
.from("products")
.insert(product);

if(error){

console.error(error);

message.innerHTML=
`<div class="message error">
${escapeHtml(error.message)}
</div>`;

return;

}


message.innerHTML=
`<div class="message success">
Product published successfully!
</div>`;

document
.getElementById("productForm")
.reset();

await loadProducts();

setTimeout(()=>{

closeAddProduct();

message.innerHTML="";

},1000);

});


/* ================= ORDERS ================= */

async function loadOrders(){

const container=
document.getElementById("orders");

container.innerHTML=
`<div class="empty">Loading orders...</div>`;


/*
  This uses the columns already fixed in your
  current orders table:
  unit_price
  total_price
*/

const {data,error}=
await supabaseClient
.from("orders")
.select(`
id,
product_id,
buyer_id,
seller_id,
quantity,
unit_price,
total_price,
status,
created_at
`)
.or(
`buyer_id.eq.${currentProfile?.id},seller_id.eq.${currentProfile?.id}`
)
.order("created_at",{ascending:false});


if(error){

console.error(error);

container.innerHTML=
`<div class="empty">
Unable to load orders.<br>
${escapeHtml(error.message)}
</div>`;

return;

}


if(!data || data.length===0){

container.innerHTML=
`<div class="empty">
<h3>No orders yet</h3>
<p>Your orders will appear here.</p>
</div>`;

return;

}


container.innerHTML=
data.map(order=>{

return `

<div class="order-card">

<div class="order-top">

<strong>
Order #${escapeHtml(order.id).slice(0,8)}
</strong>

<span class="order-status">
${escapeHtml(order.status || "PENDING")}
</span>

</div>

<div class="order-info">

Quantity:
${escapeHtml(order.quantity)}<br>

Unit Price:
₱${Number(order.unit_price || 0).toLocaleString()}<br>

Total:
<strong>
₱${Number(order.total_price || 0).toLocaleString()}
</strong>

</div>

<div class="order-actions">

${
["PENDING","CONFIRMED"].includes(order.status)
?
`<button
onclick="cancelOrder('${order.id}')">
Cancel Order
</button>`
:
""
}

</div>

</div>

`;

}).join("");

}


/* ================= BUY PRODUCT ================= */

async function buyProduct(productId){

if(!currentUser){

alert("Please login first.");
return;

}

const {data:product,error}=
await supabaseClient
.from("products")
.select("*")
.eq("id",productId)
.single();

if(error || !product){

alert("Product could not be found.");
return;

}


if(product.seller_id===currentProfile.id){

alert("You cannot buy your own product.");
return;

}


const quantityText=
prompt(
`How many ${product.unit} do you want to buy?`,
"1"
);

if(quantityText===null)return;

const quantity=Number(quantityText);

if(
!Number.isFinite(quantity) ||
quantity<=0
){

alert("Please enter a valid quantity.");
return;

}

if(quantity>Number(product.quantity)){

alert("Not enough quantity available.");
return;

}


const total=
Number(product.price)*quantity;


const {error:orderError}=
await supabaseClient
.from("orders")
.insert({

product_id:product.id,

buyer_id:currentProfile.id,

seller_id:product.seller_id,

quantity:quantity,

unit_price:Number(product.price),

total_price:total,

status:"PENDING"

});


if(orderError){

console.error(orderError);

alert(orderError.message);

return;

}


/*
  Reduce inventory after order.
*/

const remaining=
Number(product.quantity)-quantity;


await supabaseClient
.from("products")
.update({

quantity:remaining,

status:remaining<=0 ? "SOLD" : "ACTIVE"

})
.eq("id",product.id);


alert("Order created successfully!");

await loadProducts();
await loadOrders();

}


/* ================= CANCEL ORDER ================= */

async function cancelOrder(orderId){

if(!confirm("Cancel this order?"))return;

const {error}=
await supabaseClient
.from("orders")
.update({
status:"CANCELLED"
})
.eq("id",orderId);


if(error){

alert(error.message);
return;

}

await loadOrders();

}


/* ================= CHAT ================= */

function openChat(){

document
.getElementById("chatModal")
.classList.remove("hidden");

loadConversations();

}


function closeChat(){

document
.getElementById("chatModal")
.classList.add("hidden");

if(messageChannel){

supabaseClient
.removeChannel(messageChannel);

messageChannel=null;

}

currentConversation=null;

}


async function startChat(sellerId,productId){

if(!currentUser){

alert("Please login first.");
return;

}

if(sellerId===currentProfile.id){

alert("You cannot chat with yourself.");
return;

}


const {data:existing,error:findError}=
await supabaseClient
.from("conversations")
.select("*")
.eq("buyer_id",currentProfile.id)
.eq("seller_id",sellerId)
.eq("product_id",productId)
.maybeSingle();


if(findError){

console.error(findError);
alert(findError.message);
return;

}


let conversation=existing;


if(!conversation){

const {data:newConversation,error}=
await supabaseClient
.from("conversations")
.insert({

buyer_id:currentProfile.id,
seller_id:sellerId,
product_id:productId

})
.select()
.single();


if(error){

console.error(error);
alert(error.message);
return;

}

conversation=newConversation;

}


openChat();

setTimeout(()=>{

selectConversation(conversation);

},300);

}


async function loadConversations(){

const list=
document.getElementById("conversationList");

list.innerHTML=
`<div class="chat-empty">Loading...</div>`;


const {data,error}=
await supabaseClient
.from("conversations")
.select("*")
.or(
`buyer_id.eq.${currentProfile.id},seller_id.eq.${currentProfile.id}`
)
.order("updated_at",{ascending:false});


if(error){

console.error(error);

list.innerHTML=
`<div class="chat-empty">
${escapeHtml(error.message)}
</div>`;

return;

}


if(!data || data.length===0){

list.innerHTML=
`<div class="chat-empty">
No conversations yet.
</div>`;

return;

}


list.innerHTML="";


for(const conversation of data){

const otherUserId=
conversation.buyer_id===currentProfile.id
?
conversation.seller_id
:
conversation.buyer_id;


const {data:user}=
await supabaseClient
.from("users")
.select("id,full_name,role")
.eq("id",otherUserId)
.single();


const item=
document.createElement("div");

item.className="conversation-item";

item.innerHTML=`

<div class="conversation-name">
${escapeHtml(user?.full_name || "User")}
</div>

<div class="conversation-preview">
${escapeHtml(user?.role || "")}
</div>

`;

item.onclick=()=>{
selectConversation(conversation);
};

list.appendChild(item);

}

}


async function selectConversation(conversation){

currentConversation=conversation;


const otherUserId=
conversation.buyer_id===currentProfile.id
?
conversation.seller_id
:
conversation.buyer_id;


const {data:user}=
await supabaseClient
.from("users")
.select("full_name,role")
.eq("id",otherUserId)
.single();


document
.getElementById("chatUserName")
.textContent=
user?.full_name || "User";


await loadMessages();

subscribeToMessages();

}


async function loadMessages(){

if(!currentConversation)return;


const messagesBox=
document.getElementById("chatMessages");

messagesBox.innerHTML=
`<div class="chat-empty">
Loading messages...
</div>`;


const {data,error}=
await supabaseClient
.from("messages")
.select("*")
.eq(
"conversation_id",
currentConversation.id
)
.order("created_at",{ascending:true});


if(error){

console.error(error);

messagesBox.innerHTML=
`<div class="chat-empty">
${escapeHtml(error.message)}
</div>`;

return;

}


if(!data || data.length===0){

messagesBox.innerHTML=
`<div class="chat-empty">
No messages yet.<br>
Say hello 👋
</div>`;

return;

}


messagesBox.innerHTML=
data.map(renderMessage).join("");

messagesBox.scrollTop=
messagesBox.scrollHeight;

}


function renderMessage(message){

const mine=
message.sender_id===currentProfile.id;


const time=
new Date(message.created_at)
.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});


return `

<div
class="message-row ${mine?"mine":""}"
id="message-${message.id}">

<div class="chat-bubble">

<div>
${escapeHtml(message.message)}
</div>

<div class="chat-time">

${time}

${
mine
?
`<button
class="message-delete"
onclick="deleteMessage('${message.id}')">
Delete
</button>`
:
""
}

</div>

</div>

</div>

`;

}


function subscribeToMessages(){

if(messageChannel){

supabaseClient
.removeChannel(messageChannel);

}

messageChannel=
supabaseClient
.channel(
"conversation-"+currentConversation.id
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:
`conversation_id=eq.${currentConversation.id}`
},
payload=>{

const box=
document.getElementById("chatMessages");

const empty=
box.querySelector(".chat-empty");

if(empty){
box.innerHTML="";
}

box.insertAdjacentHTML(
"beforeend",
renderMessage(payload.new)
);

box.scrollTop=
box.scrollHeight;

}
)
.on(
"postgres_changes",
{
event:"DELETE",
schema:"public",
table:"messages",
filter:
`conversation_id=eq.${currentConversation.id}`
},
payload=>{

const element=
document.getElementById(
"message-"+payload.old.id
);

if(element){
element.remove();
}

}
)
.subscribe();

}


document
.getElementById("chatForm")
.addEventListener("submit",async e=>{

e.preventDefault();

if(!currentConversation)return;

const input=
document.getElementById("chatInput");

const text=
input.value.trim();

if(!text)return;


input.disabled=true;


const {error}=
await supabaseClient
.from("messages")
.insert({

conversation_id:
currentConversation.id,

sender_id:
currentProfile.id,

message:text

});


input.disabled=false;

if(error){

alert(error.message);
return;

}

input.value="";


await supabaseClient
.from("conversations")
.update({
updated_at:new Date().toISOString()
})
.eq("id",currentConversation.id);


});


async function deleteMessage(messageId){

if(!confirm("Delete this message?"))return;


const {error}=
await supabaseClient
.from("messages")
.delete()
.eq("id",messageId)
.eq("sender_id",currentProfile.id);


if(error){

alert(error.message);

}

}


/* ================= LOGOUT ================= */

async function logout(){

if(messageChannel){

await supabaseClient
.removeChannel(messageChannel);

messageChannel=null;

}

await supabaseClient.auth.signOut();

currentUser=null;
currentProfile=null;

document
.getElementById("app")
.classList.add("hidden");

document
.getElementById("authScreen")
.classList.remove("hidden");

showLogin();

}


/* ================= SESSION ================= */

async function checkSession(){

const {data}=
await supabaseClient.auth.getSession();

if(data.session){

await initializeApp(
data.session.user
);

}

}


checkSession();

</script>
