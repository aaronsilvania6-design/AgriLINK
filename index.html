<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgriLink AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .1);
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 18px;
      background: #c62828;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      margin: auto;
    }

    .brand {
      text-align: center;
      color: #c62828;
      margin-top: 12px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 6px 0 25px;
    }

    .tabs {
      display: flex;
      background: #f1f1f1;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      border: none;
      padding: 11px;
      border-radius: 9px;
      background: transparent;
      font-weight: bold;
    }

    .tab.active {
      background: white;
      color: #c62828;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 13px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #c62828;
    }

    input[type="file"] {
      padding: 10px;
      background: #fafafa;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: #c62828;
      color: white;
      padding: 14px;
      border-radius: 11px;
      font-weight: bold;
      margin-top: 20px;
    }

    .primary-btn:hover {
      background: #a91f1f;
    }

    .secondary-btn {
      border: none;
      background: #eee;
      padding: 11px 15px;
      border-radius: 10px;
    }

    .danger-btn {
      border: none;
      background: #222;
      color: white;
      padding: 11px 15px;
      border-radius: 10px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    /* =========================
       APPLICATION
    ========================= */

    .app {
      min-height: 100vh;
    }

    .navbar {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      color: #c62828;
      font-size: 18px;
    }

    .nav-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #c62828;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    .welcome {
      background: #c62828;
      color: white;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin-bottom: 7px;
    }

    .role-badge {
      display: inline-block;
      margin-top: 10px;
      background: rgba(255, 255, 255, .18);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      border: 1px solid #eee;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .04);
    }

    .product-image {
      width: 100%;
      height: 180px;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-placeholder {
      font-size: 50px;
    }

    .product-content {
      padding: 16px;
    }

    .product-content h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #c62828;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .quantity {
      font-size: 13px;
      color: #555;
      margin-top: 8px;
    }

    .product-description {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
      margin-top: 8px;
    }

    .product-location {
      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }

    .empty {
      background: white;
      border: 1px dashed #ccc;
      padding: 40px 20px;
      border-radius: 16px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .close {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 18px;
    }

    .preview {
      width: 100%;
      height: 200px;
      background: #f1f1f1;
      border-radius: 12px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-info {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
    }

    /* =========================
       MOBILE / TABLET
    ========================= */

    @media (max-width: 700px) {

      .navbar {
        padding: 12px;
      }

      .container {
        padding: 18px 12px;
      }

      .nav-actions {
        gap: 5px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-image {
        height: 135px;
      }

      .product-content {
        padding: 12px;
      }

      .product-content h3 {
        font-size: 15px;
      }

      .price {
        font-size: 16px;
      }

      .welcome {
        padding: 20px;
      }
    }

    @media (max-width: 450px) {

      .nav-brand {
        font-size: 15px;
      }

      .nav-logo {
        width: 32px;
        height: 32px;
      }

      .secondary-btn,
      .danger-btn {
        padding: 9px 10px;
        font-size: 12px;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }

      .modal {
        padding: 10px;
      }

      .modal-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authScreen" class="auth-container">

  <div class="auth-card">

    <div class="logo">🌾</div>

    <h1 class="brand">AgriLink AI</h1>

    <p class="subtitle">
      Connect. Trade. Grow.
    </p>

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        type="button"
        onclick="showLogin()">
        Login
      </button>

      <button
        id="signupTab"
        class="tab"
        type="button"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>

    <!-- LOGIN -->

    <form id="loginForm">

      <label>Email</label>

      <input
        id="loginEmail"
        type="email"
        required
        autocomplete="email"
        placeholder="you@example.com">

      <label>Password</label>

      <input
        id="loginPassword"
        type="password"
        required
        autocomplete="current-password"
        placeholder="Your password">

      <button
        class="primary-btn"
        type="submit">
        Login
      </button>

    </form>


    <!-- SIGNUP -->

    <form id="signupForm" class="hidden">

      <label>Full Name</label>

      <input
        id="signupName"
        required
        autocomplete="name"
        placeholder="Juan Dela Cruz">

      <label>Email</label>

      <input
        id="signupEmail"
        type="email"
        required
        autocomplete="email"
        placeholder="you@example.com">

      <label>Password</label>

      <input
        id="signupPassword"
        type="password"
        minlength="8"
        required
        autocomplete="new-password"
        placeholder="Minimum 8 characters">

      <label>Account Type</label>

      <select id="signupRole">

        <option value="BUYER">
          Buyer
        </option>

        <option value="FARMER">
          Farmer
        </option>

        <option value="ORGANIZATION">
          Organization
        </option>

      </select>

      <button
        class="primary-btn"
        type="submit">
        Create Account
      </button>

    </form>

    <div id="authMessage"></div>

  </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="app hidden">

  <nav class="navbar">

    <div class="nav-brand">

      <div class="nav-logo">🌾</div>

      AgriLink AI

    </div>

    <div class="nav-actions">

      <button
        class="secondary-btn"
        type="button"
        onclick="openAddProduct()"
        id="addProductButton">
        + Add Product
      </button>

      <button
        class="danger-btn"
        type="button"
        onclick="logout()">
        Logout
      </button>

    </div>

  </nav>


  <main class="container">

    <section class="welcome">

      <h1>
        Welcome, <span id="userName">User</span>!
      </h1>

      <p>
        Welcome to your agricultural marketplace.
      </p>

      <div
        id="roleBadge"
        class="role-badge">
      </div>

    </section>


    <section>

      <div class="section-title">

        <h2>Marketplace</h2>

        <button
          class="secondary-btn"
          type="button"
          onclick="loadProducts()">
          Refresh
        </button>

      </div>

      <div
        id="products"
        class="products">
      </div>

    </section>

  </main>

</div>


<!-- =========================
     ADD PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>Add Product</h2>

      <button
        class="close"
        type="button"
        onclick="closeAddProduct()">
        ×
      </button>

    </div>


    <form id="productForm">

      <!-- PRODUCT PHOTO -->

      <label>Product Photo</label>

      <input
        id="productImage"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        required>

      <div class="upload-info">
        JPG, PNG, or WEBP • Maximum 5MB
      </div>

      <div
        id="imagePreview"
        class="preview">

        <img
          id="previewImage"
          alt="Product preview">

      </div>


      <!-- PRODUCT NAME -->

      <label>Product Name</label>

      <input
        id="productName"
        required
        placeholder="Fresh Tomatoes">


      <!-- DESCRIPTION -->

      <label>Description</label>

      <textarea
        id="productDescription"
        placeholder="Describe your product"></textarea>


      <!-- PRICE -->

      <label>Price</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        required
        placeholder="80">


      <!-- QUANTITY -->

      <label>Quantity</label>

      <input
        id="productQuantity"
        type="number"
        min="0"
        step="0.01"
        required
        placeholder="50">


      <!-- UNIT -->

      <label>Unit</label>

      <select id="productUnit">

        <option value="kg">kg</option>

        <option value="piece">
          piece
        </option>

        <option value="sack">
          sack
        </option>

        <option value="box">
          box
        </option>

        <option value="dozen">
          dozen
        </option>

      </select>


      <!-- LOCATION -->

      <label>Location</label>

      <input
        id="productLocation"
        placeholder="Municipality / Province">


      <button
        class="primary-btn"
        type="submit">
        Publish Product
      </button>

      <div id="productMessage"></div>

    </form>

  </div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
  "https://ivbqudztsmsylnodydce.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_J6ofqkb71svrAJr1-mvFIA_hy3RKHrM";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;

let currentProfile = null;


/* =========================
   AUTH TABS
========================= */

function showLogin() {

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("signupForm")
    .classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("signupTab")
    .classList.remove("active");

}


function showSignup() {

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("signupForm")
    .classList.remove("hidden");

  document
    .getElementById("signupTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

}


/* =========================
   AUTH MESSAGE
========================= */

function showAuthMessage(text, type) {

  const box =
    document.getElementById("authMessage");

  box.className =
    "message " + type;

  box.textContent = text;

}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email,
            password

          });


      if (error) {

        showAuthMessage(
          error.message,
          "error"
        );

        return;
      }


      await initializeApp(
        data.user
      );

    }
  );


/* =========================
   SIGN UP
========================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const fullName =
        document
          .getElementById("signupName")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      const role =
        document
          .getElementById("signupRole")
          .value;


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signUp({

            email,

            password,

            options: {

              data: {

                full_name:
                  fullName,

                role:
                  role

              }

            }

          });


      if (error) {

        showAuthMessage(
          error.message,
          "error"
        );

        return;
      }


      showAuthMessage(
        "Account created successfully. You can now log in.",
        "success"
      );


      document
        .getElementById("signupForm")
        .reset();

    }
  );


/* =========================
   INITIALIZE APP
========================= */

async function initializeApp(user) {

  currentUser = user;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("users")
      .select("*")
      .eq("auth_user_id", user.id)
      .single();


  if (error) {

    console.error(error);

    alert(
      "Your account exists, but your AgriLink profile could not be loaded."
    );

    return;
  }


  currentProfile = profile;


  document
    .getElementById("authScreen")
    .classList.add("hidden");


  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("userName")
    .textContent =
      profile.full_name;


  document
    .getElementById("roleBadge")
    .textContent =
      profile.role;


  const addButton =
    document
      .getElementById("addProductButton");


  if (
    profile.role !== "FARMER"
  ) {

    addButton
      .classList
      .add("hidden");

  } else {

    addButton
      .classList
      .remove("hidden");

  }


  await loadProducts();

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const container =
    document
      .getElementById("products");


  container.innerHTML = `
    <div class="empty">
      Loading products...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        description,
        price,
        quantity,
        unit,
        location,
        image_url,
        status
      `)
      .eq("status", "ACTIVE")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Unable to load products.
      </div>
    `;

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `
      <div class="empty">

        <h3>
          No products yet
        </h3>

        <p>
          Be the first farmer to publish a product.
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML =
    data
      .map(product => {

        const image =
          product.image_url
            ? `
              <img
                src="${escapeHtml(product.image_url)}"
                alt="${escapeHtml(product.name)}"
                loading="lazy">
            `
            : `
              <div class="product-placeholder">
                🌱
              </div>
            `;


        return `

          <div class="product-card">

            <div class="product-image">

              ${image}

            </div>


            <div class="product-content">

              <h3>
                ${escapeHtml(
                  product.name
                )}
              </h3>


              <div class="price">

                ₱${Number(
                  product.price
                ).toLocaleString()}

                /
                ${escapeHtml(
                  product.unit
                )}

              </div>


              <div class="quantity">

                Available:
                ${Number(
                  product.quantity
                ).toLocaleString()}

                ${escapeHtml(
                  product.unit
                )}

              </div>


              <p class="product-description">

                ${escapeHtml(
                  product.description ||
                  "No description"
                )}

              </p>


              <div class="product-location">

                📍
                ${escapeHtml(
                  product.location ||
                  "Location not specified"
                )}

              </div>

            </div>

          </div>

        `;

      })
      .join("");

}


/* =========================
   ADD PRODUCT MODAL
========================= */

function openAddProduct() {

  if (
    !currentProfile ||
    currentProfile.role !== "FARMER"
  ) {

    alert(
      "Only farmer accounts can publish products."
    );

    return;
  }


  document
    .getElementById("productModal")
    .classList
    .remove("hidden");

}


function closeAddProduct() {

  document
    .getElementById("productModal")
    .classList
    .add("hidden");

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("productImage")
  .addEventListener(
    "change",
    function () {

      const file =
        this.files[0];

      const preview =
        document
          .getElementById("imagePreview");

      const previewImage =
        document
          .getElementById("previewImage");


      if (!file) {

        preview.style.display =
          "none";

        previewImage.src =
          "";

        return;
      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];


      if (
        !allowedTypes.includes(
          file.type
        )
      ) {

        alert(
          "Please select a JPG, PNG, or WEBP image."
        );

        this.value = "";

        preview.style.display =
          "none";

        return;
      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        alert(
          "Image must be smaller than 5MB."
        );

        this.value = "";

        preview.style.display =
          "none";

        return;
      }


      const imageUrl =
        URL.createObjectURL(file);


      previewImage.src =
        imageUrl;


      preview.style.display =
        "flex";

    }
  );


/* =========================
   CREATE PRODUCT
========================= */

document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      if (
        !currentUser ||
        !currentProfile ||
        currentProfile.role !== "FARMER"
      ) {

        alert(
          "Only farmer accounts can publish products."
        );

        return;
      }


      const imageFile =
        document
          .getElementById("productImage")
          .files[0];


      if (!imageFile) {

        alert(
          "Please select a product photo."
        );

        return;
      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];


      if (
        !allowedTypes.includes(
          imageFile.type
        )
      ) {

        alert(
          "Please upload JPG, PNG, or WEBP."
        );

        return;
      }


      if (
        imageFile.size >
        5 * 1024 * 1024
      ) {

        alert(
          "Image must be smaller than 5MB."
        );

        return;
      }


      const message =
        document
          .getElementById("productMessage");


      message.innerHTML = `
        <div class="message">
          Uploading product photo...
        </div>
      `;


      /* =========================
         FILE NAME
      ========================= */

      const fileExtension =
        imageFile.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${crypto.randomUUID()}.${fileExtension}`;


      const filePath =
        `${currentUser.id}/${fileName}`;


      /* =========================
         UPLOAD IMAGE
      ========================= */

      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            filePath,
            imageFile,
            {
              contentType:
                imageFile.type,

              upsert:
                false
            }
          );


      if (uploadError) {

        console.error(
          uploadError
        );

        message.innerHTML = `
          <div class="message error">
            Image upload failed:
            ${escapeHtml(
              uploadError.message
            )}
          </div>
        `;

        return;
      }


      /* =========================
         GET PUBLIC URL
      ========================= */

      const {
        data: imageData
      } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(
            filePath
          );


      const imageUrl =
        imageData.publicUrl;


      /* =========================
         PRODUCT DATA
      ========================= */

      const product = {

        seller_id:
          currentProfile.id,

        name:
          document
            .getElementById(
              "productName"
            )
            .value
            .trim(),

        description:
          document
            .getElementById(
              "productDescription"
            )
            .value
            .trim(),

        price:
          Number(
            document
              .getElementById(
                "productPrice"
              )
              .value
          ),

        quantity:
          Number(
            document
              .getElementById(
                "productQuantity"
              )
              .value
          ),

        unit:
          document
            .getElementById(
              "productUnit"
            )
            .value,

        location:
          document
            .getElementById(
              "productLocation"
            )
            .value
            .trim(),

        image_url:
          imageUrl,

        status:
          "ACTIVE"

      };


      /* =========================
         INSERT PRODUCT
      ========================= */

      message.innerHTML = `
        <div class="message">
          Saving product...
        </div>
      `;


      const {
        error
      } =
        await supabaseClient
          .from("products")
          .insert(product);


      if (error) {

        console.error(error);

        message.innerHTML = `
          <div class="message error">

            Product could not be saved:

            ${escapeHtml(
              error.message
            )}

          </div>
        `;

        return;
      }


      /* =========================
         SUCCESS
      ========================= */

      message.innerHTML = `
        <div class="message success">

          Product published successfully!

        </div>
      `;


      document
        .getElementById(
          "productForm"
        )
        .reset();


      document
        .getElementById(
          "imagePreview"
        )
        .style
        .display = "none";


      await loadProducts();


      setTimeout(
        () => {

          closeAddProduct();

          message.innerHTML =
            "";

        },
        1000
      );

    }
  );


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient
    .auth
    .signOut();


  currentUser =
    null;

  currentProfile =
    null;


  document
    .getElementById("app")
    .classList
    .add("hidden");


  document
    .getElementById("authScreen")
    .classList
    .remove("hidden");


  showLogin();

}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   SESSION CHECK
========================= */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    data &&
    data.session
  ) {

    await initializeApp(
      data.session.user
    );

  }

}


/* =========================
   START APP
========================= */

checkSession();

</script>
