<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#16833b">
<title>AgriLink AI — Agricultural Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

:root{
  --green:#16833b;
  --green2:#22a447;
  --green3:#eaf8ef;
  --green4:#d7f3df;
  --dark:#12351f;
  --text:#1e2922;
  --muted:#718078;
  --bg:#f5f8f5;
  --white:#fff;
  --border:#e1e9e3;
  --red:#d93025;
  --orange:#ed8b00;
  --blue:#2878d4;
  --shadow:0 18px 50px rgba(20,70,35,.09);
}

html{
  scroll-behavior:smooth
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.hidden{
  display:none!important
}

.section{
  margin-top:28px
}

/* =========================================================
LANDING
========================================================= */

.landing{
  min-height:100vh;
  background:
    radial-gradient(circle at 90% 5%,rgba(34,164,71,.13),transparent 28%),
    radial-gradient(circle at 10% 70%,rgba(22,131,59,.08),transparent 25%),
    linear-gradient(135deg,#fff 0%,#fff 48%,#f1faf4 100%);
}

.landing-nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  border-bottom:1px solid rgba(0,0,0,.05);
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:20px;
  font-weight:900;
  color:var(--green);
}

.brand-icon{
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:white;
  box-shadow:0 8px 20px rgba(22,131,59,.25);
}

.landing-nav button{
  border:0;
  background:var(--dark);
  color:white;
  padding:11px 20px;
  border-radius:12px;
  font-weight:700;
}

.hero{
  max-width:1250px;
  margin:auto;
  min-height:calc(100vh - 76px);
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:60px;
  padding:70px 25px;
}

.hero-tag{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 13px;
  background:var(--green3);
  color:var(--green);
  border-radius:30px;
  font-size:13px;
  font-weight:800;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(43px,6vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:25px;
}

.hero h1 span{
  color:var(--green)
}

.hero p{
  font-size:18px;
  line-height:1.7;
  color:var(--muted);
  max-width:620px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:30px;
  flex-wrap:wrap;
}

.hero-primary{
  border:0;
  background:var(--green);
  color:white;
  padding:15px 23px;
  border-radius:13px;
  font-weight:800;
  box-shadow:0 12px 25px rgba(22,131,59,.22);
}

.hero-primary:hover{
  background:#116c30
}

.hero-secondary{
  border:1px solid var(--border);
  background:white;
  padding:15px 23px;
  border-radius:13px;
  font-weight:800;
}

.hero-visual{
  position:relative;
  min-height:480px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.farm-orb{
  width:min(430px,80vw);
  height:430px;
  border-radius:50%;
  background:
    linear-gradient(145deg,rgba(34,164,71,.12),rgba(255,255,255,.7));
  border:1px solid rgba(22,131,59,.12);
  display:grid;
  place-items:center;
  font-size:145px;
  box-shadow:0 30px 80px rgba(22,131,59,.12);
}

.floating-card{
  position:absolute;
  background:white;
  padding:18px;
  border-radius:17px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.float-one{
  top:65px;
  left:10px
}

.float-two{
  bottom:55px;
  right:0
}

.float-three{
  top:45%;
  right:-20px
}

.float-title{
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.float-value{
  font-weight:900;
  font-size:19px;
}

.features{
  max-width:1200px;
  margin:auto;
  padding:50px 20px 100px;
}

.features h2{
  font-size:35px;
  margin-bottom:30px;
  text-align:center;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.feature-card{
  background:white;
  border:1px solid var(--border);
  padding:27px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.feature-icon{
  font-size:30px;
  margin-bottom:15px;
}

.feature-card h3{
  margin-bottom:8px;
}

.feature-card p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

/* =========================================================
AUTH
========================================================= */

.auth-container{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 460px;
  background:#fff;
}

.auth-showcase{
  background:
    linear-gradient(145deg,rgba(22,131,59,.97),rgba(8,76,31,.99));
  color:white;
  padding:60px;
  display:flex;
  align-items:center;
}

.auth-showcase-inner{
  max-width:600px;
  margin:auto;
}

.auth-showcase h1{
  font-size:clamp(42px,5vw,65px);
  line-height:1;
  margin-bottom:20px;
}

.auth-showcase p{
  line-height:1.7;
  opacity:.88;
  font-size:17px;
}

.auth-points{
  display:grid;
  gap:12px;
  margin-top:30px;
}

.auth-point{
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:700;
}

.auth-card{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:35px;
}

.auth-logo{
  width:64px;
  height:64px;
  display:grid;
  place-items:center;
  background:var(--green);
  border-radius:18px;
  font-size:32px;
  color:white;
  margin-bottom:18px;
  box-shadow:0 12px 30px rgba(22,131,59,.22);
}

.auth-card h2{
  font-size:30px;
  margin-bottom:7px;
}

.auth-subtitle{
  color:var(--muted);
  margin-bottom:25px;
}

.tabs{
  display:flex;
  background:#f1f5f2;
  padding:4px;
  border-radius:12px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  border:0;
  padding:11px;
  background:transparent;
  border-radius:9px;
  font-weight:800;
}

.tab.active{
  background:white;
  color:var(--green);
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:14px 0 6px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  background:white;
  padding:13px;
  border-radius:11px;
  outline:none;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(22,131,59,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  border:0;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:white;
  padding:14px;
  border-radius:11px;
  font-weight:800;
  margin-top:20px;
}

.message{
  padding:12px;
  border-radius:11px;
  margin-top:14px;
  font-size:13px;
  line-height:1.5;
}

.success{
  background:#e8f5e9;
  color:#1b5e20
}

.error{
  background:#ffebee;
  color:#b71c1c
}

/* =========================================================
NAVBAR
========================================================= */

.navbar{
  height:70px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:40;
}

.nav-brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:19px;
  font-weight:900;
  color:var(--green);
}

.nav-logo{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  background:var(--green);
  border-radius:11px;
  color:white;
}

.nav-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

.secondary-btn,
.danger-btn{
  border:1px solid var(--border);
  background:white;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
}

.secondary-btn:hover{
  background:var(--green3);
  border-color:var(--green4);
}

.danger-btn{
  background:#16351f;
  color:white;
  border-color:#16351f;
}

/* =========================================================
MAIN
========================================================= */

.container{
  max-width:1250px;
  margin:auto;
  padding:25px 20px 70px;
}

.welcome{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(135deg,#116d32,var(--green),#39b95c);
  color:white;
  padding:32px;
  border-radius:24px;
  margin-bottom:22px;
  box-shadow:0 20px 45px rgba(22,131,59,.18);
}

.welcome:after{
  content:"🌾";
  position:absolute;
  right:35px;
  bottom:-25px;
  font-size:150px;
  opacity:.1;
}

.welcome h1{
  font-size:30px;
  margin-bottom:7px;
  position:relative;
  z-index:1;
}

.welcome p{
  opacity:.88;
  position:relative;
  z-index:1;
}

.role-badge{
  display:inline-block;
  margin-top:13px;
  padding:7px 12px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.25);
  border-radius:30px;
  font-size:12px;
  font-weight:800;
}

/* =========================================================
SEARCH
========================================================= */

.search-box{
  background:white;
  padding:20px;
  border-radius:19px;
  border:1px solid var(--border);
  box-shadow:0 8px 25px rgba(0,0,0,.04);
  margin-bottom:25px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.search-grid{
  display:grid;
  grid-template-columns:2fr 2fr 1fr auto auto;
  gap:9px;
}

/* =========================================================
PRODUCTS
========================================================= */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:17px;
}

.product-card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
  box-shadow:0 5px 18px rgba(0,0,0,.03);
}

.product-card:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 35px rgba(0,0,0,.08);
}

.product-image{
  height:175px;
  background:linear-gradient(135deg,#edf7ef,#fafafa);
  display:grid;
  place-items:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-placeholder{
  font-size:55px;
}

.product-content{
  padding:16px;
}

.product-content h3{
  margin-bottom:7px;
}

.price{
  color:var(--green);
  font-weight:900;
  font-size:18px;
  margin-bottom:7px;
}

.product-description{
  font-size:13px;
  line-height:1.5;
  color:#555;
  min-height:38px;
  margin-bottom:9px;
}

.product-location,
.product-seller{
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.product-seller{
  cursor:pointer;
}

.product-seller:hover{
  color:var(--green);
}

.product-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.product-actions button{
  flex:1;
  border:0;
  padding:10px;
  border-radius:9px;
  font-weight:800;
}

.chat-btn{
  background:#eef2ef
}

.buy-btn{
  background:var(--green);
  color:white
}

.delete-product{
  background:#16351f;
  color:white
}

/* =========================================================
FARMER STATS
========================================================= */

.farmer-dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
}

.stat-value{
  font-size:28px;
  font-weight:900;
  margin-top:5px;
  color:var(--green);
}

/* =========================================================
ORDERS
========================================================= */

.orders{
  display:grid;
  gap:12px;
}

.order-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.order-status{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  background:#eee;
}

.status-PENDING{
  background:#fff3e0;
  color:#e65100
}

.status-CONFIRMED{
  background:#e3f2fd;
  color:#1565c0
}

.status-ONGOING{
  background:#e8f5e9;
  color:#2e7d32
}

.status-COMPLETED{
  background:#e8f5e9;
  color:#1b5e20
}

.status-CANCELLED,
.status-REJECTED{
  background:#ffebee;
  color:#b71c1c
}

.order-info{
  font-size:13px;
  line-height:1.8;
  color:#666;
}

.order-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.order-actions button{
  border:0;
  padding:9px 12px;
  border-radius:9px;
  font-weight:700;
}

.accept-btn{
  background:var(--green);
  color:white
}

.reject-btn{
  background:#222;
  color:white
}

.complete-btn{
  background:var(--blue);
  color:white
}

.cancel-btn{
  background:#eee
}

/* =========================================================
EMPTY
========================================================= */

.empty{
  background:white;
  border:1px dashed #cbd8cf;
  border-radius:16px;
  padding:38px 20px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

/* =========================================================
FARMER PROFILE
========================================================= */

.profile-card{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.profile-cover{
  height:150px;
  background:
    linear-gradient(135deg,#0d612b,#16833b,#4fc56b);
  position:relative;
}

.profile-cover:after{
  content:"🌾";
  position:absolute;
  right:35px;
  bottom:-35px;
  font-size:120px;
  opacity:.12;
}

.profile-main{
  padding:0 25px 25px;
  margin-top:-43px;
  position:relative;
}

.profile-avatar{
  width:86px;
  height:86px;
  border-radius:24px;
  background:linear-gradient(135deg,#fff,#e7f7eb);
  border:5px solid white;
  display:grid;
  place-items:center;
  font-size:40px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.profile-name{
  margin-top:13px;
  font-size:27px;
  font-weight:900;
}

.profile-role{
  display:inline-block;
  margin-top:6px;
  padding:6px 10px;
  background:var(--green3);
  color:var(--green);
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.profile-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  color:var(--muted);
  font-size:13px;
  margin-top:13px;
}

.profile-bio{
  margin-top:17px;
  color:#58645d;
  line-height:1.6;
}

/* =========================================================
MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-card{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.close{
  border:0;
  background:#eef2ef;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

/* =========================================================
PROFILE MODAL
========================================================= */

.profile-modal-card{
  max-width:850px;
  padding:0;
  overflow:hidden;
}

.profile-modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 20px;
  border-bottom:1px solid var(--border);
}

.profile-modal-content{
  padding:20px;
}

.profile-product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
  margin-top:17px;
}

.mini-product{
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  background:white;
}

.mini-product-img{
  height:120px;
  background:#eef8f0;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.mini-product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.mini-product-body{
  padding:12px;
}

.mini-product-name{
  font-weight:900;
}

.mini-product-price{
  color:var(--green);
  font-weight:900;
  margin-top:5px;
}

/* =========================================================
CHAT
========================================================= */

.chat-modal .modal-card{
  max-width:950px;
  padding:0;
  overflow:hidden;
}

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  height:75vh;
  min-height:500px;
}

.conversation-list{
  border-right:1px solid var(--border);
  background:#fafcfb;
  overflow:auto;
}

.chat-list-header{
  padding:17px;
  font-weight:900;
  border-bottom:1px solid var(--border);
}

.conversation-item{
  padding:14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.conversation-item:hover,
.conversation-item.active{
  background:white;
}

.conversation-name{
  font-weight:800
}

.conversation-preview{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.chat-user{
  font-weight:900
}

.online{
  font-size:11px;
  color:var(--green);
  margin-top:3px;
}

.chat-messages{
  flex:1;
  padding:18px;
  overflow:auto;
  background:#f7faf8;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message-row{
  display:flex
}

.message-row.mine{
  justify-content:flex-end
}

.chat-bubble{
  max-width:75%;
  padding:10px 13px;
  border-radius:15px;
  background:white;
  border:1px solid var(--border);
}

.message-row.mine .chat-bubble{
  background:#e7f6eb;
  border-color:#ccebd4;
}

.chat-time{
  font-size:10px;
  color:#999;
  margin-top:4px;
}

.message-delete{
  border:0;
  background:transparent;
  color:#999;
  font-size:10px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--border);
  background:white;
}

.chat-input input{
  flex:1
}

.chat-input button{
  border:0;
  background:var(--green);
  color:white;
  padding:0 18px;
  border-radius:10px;
  font-weight:800;
}

/* =========================================================
NOTIFICATIONS
========================================================= */

.notification-panel{
  position:fixed;
  right:20px;
  top:78px;
  width:340px;
  max-height:450px;
  overflow:auto;
  background:white;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
