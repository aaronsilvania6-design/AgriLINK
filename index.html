<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --red:#c62828;
  --red2:#d32f2f;
  --light:#f7f7f7;
  --border:#e8e8e8;
  --text:#222;
  --muted:#777;
  --green:#2e7d32;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

.auth-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#fff 0%,#f7f7f7 55%,#eeeeee 100%);
}

.auth-card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px;
  border-radius:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.10);
}

.logo{
  width:68px;
  height:68px;
  border-radius:19px;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:33px;
  margin:auto;
}

.brand{
  text-align:center;
  color:var(--red);
  margin-top:12px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin:7px 0 25px;
}

.tabs{
  display:flex;
  background:#f1f1f1;
  padding:4px;
  border-radius:12px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  border:0;
  padding:11px;
  border-radius:9px;
  background:transparent;
  font-weight:bold;
}

.tab.active{
  background:#fff;
  color:var(--red);
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

label{
  display:block;
  margin:14px 0 6px;
  font-size:13px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:13px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(198,40,40,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--red);
  color:#fff;
  padding:14px;
  border-radius:11px;
  font-weight:bold;
  margin-top:20px;
}

.primary-btn:hover,
.buy-btn:hover{
  background:var(--red2);
}

.secondary-btn{
  border:0;
  background:#eee;
  padding:11px 15px;
  border-radius:10px;
}

.danger-btn{
  border:0;
  background:#222;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  font-size:14px;
}

.success{
  background:#e8f5e9;
  color:#1b5e20;
}

.error{
  background:#ffebee;
  color:#b71c1c;
}

/* =========================
   NAVBAR
========================= */

.navbar{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:13px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:50;
}

.nav-brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:bold;
  color:var(--red);
  font-size:18px;
}

.nav-logo{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 20px 50px;
}

.welcome{
  background:linear-gradient(135deg,#c62828,#d32f2f);
  color:#fff;
  padding:27px;
  border-radius:21px;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(198,40,40,.18);
}

.welcome h1{
  margin-bottom:7px;
}

.role-badge{
  display:inline-block;
  margin-top:10px;
  background:rgba(255,255,255,.18);
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

.section{
  margin-top:25px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

/* =========================
   PRODUCTS
========================= */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:17px;
}

.product-card{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 4px 15px rgba(0,0,0,.035);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(0,0,0,.07);
}

.product-image{
  width:100%;
  height:175px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:45px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-content{
  padding:16px;
}

.product-content h3{
  margin-bottom:8px;
}

.price{
  color:var(--red);
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.product-description{
  color:#555;
  line-height:1.4;
  font-size:14px;
}

.product-location,
.product-quantity{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.buy-btn{
  width:100%;
  border:0;
  background:var(--red);
  color:#fff;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-weight:bold;
}

.delete-btn{
  width:100%;
  border:0;
  background:#222;
  color:#fff;
  padding:11px;
  border-radius:10px;
  margin-top:12px;
}

.empty{
  background:#fff;
  border:1px dashed #ccc;
  padding:40px 20px;
  border-radius:16px;
  text-align:center;
  color:#777;
}

/* =========================
   ORDERS
========================= */

.orders{
  display:grid;
  gap:14px;
}

.order-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.order-title{
  font-size:17px;
  font-weight:bold;
}

.order-info{
  color:#666;
  font-size:14px;
  margin-top:7px;
}

.order-total{
  margin-top:10px;
  font-size:17px;
  font-weight:bold;
  color:var(--red);
}

.order-status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#eee;
  font-size:12px;
  font-weight:bold;
  margin-top:10px;
}

.status-pending{
  background:#fff3cd;
  color:#856404;
}

.status-accepted{
  background:#e8f5e9;
  color:#1b5e20;
}

.status-rejected,
.status-cancelled{
  background:#ffebee;
  color:#b71c1c;
}

.status-completed{
  background:#e3f2fd;
  color:#1565c0;
}

.order-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.order-actions button{
  border:0;
  padding:10px 13px;
  border-radius:9px;
  font-weight:bold;
}

.accept-btn{
  background:#2e7d32;
  color:white;
}

.reject-btn{
  background:#ffebee;
  color:#b71c1c;
}

.cancel-order-btn{
  background:#eee;
  color:#222;
}

.complete-btn{
  background:#1565c0;
  color:white;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.52);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:100;
}

.modal-card{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:20px;
  padding:25px;
  max-height:90vh;
  overflow-y:auto;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:18px;
}

.preview{
  width:100%;
  height:200px;
  margin-top:10px;
  border-radius:12px;
  overflow:hidden;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
   AI BUTTON
========================= */

.ai-fab{
  position:fixed;
  right:20px;
  bottom:20px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--red);
  color:white;
  font-size:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  z-index:60;
}

.ai-panel{
  position:fixed;
  right:20px;
  bottom:90px;
  width:340px;
  max-width:calc(100vw - 30px);
  height:470px;
  background:white;
  border-radius:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.2);
  z-index:60;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.ai-header{
  background:var(--red);
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.ai-messages{
  flex:1;
  padding:14px;
  overflow-y:auto;
  background:#fafafa;
}

.ai-message{
  padding:10px 12px;
  border-radius:13px;
  margin-bottom:9px;
  max-width:85%;
  font-size:14px;
  line-height:1.4;
}

.ai-user{
  margin-left:auto;
  background:#c62828;
  color:white;
}

.ai-bot{
  background:#eee;
  color:#222;
}

.ai-input{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid #eee;
}

.ai-input input{
  flex:1;
}

.ai-input button{
  border:0;
  background:var(--red);
  color:white;
  padding:10px 13px;
  border-radius:9px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .navbar{
    padding:11px;
    align-items:flex-start;
  }

  .nav-actions{
    justify-content:flex-end;
  }

  .nav-actions .secondary-btn,
  .nav-actions .danger-btn{
    padding:9px;
    font-size:12px;
  }

  .container{
    padding:18px 12px 40px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-image{
    height:120px;
  }

  .product-content{
    padding:12px;
  }

  .product-content h3{
    font-size:15px;
  }

  .price{
    font-size:16px;
  }

  .ai-panel{
    right:10px;
    bottom:80px;
    width:calc(100vw - 20px);
  }

}

</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<div id="authScreen" class="auth-container">

  <div class="auth-card">

    <div class="logo">🌾</div>

    <h1 class="brand">AgriLink AI</h1>

    <p class="subtitle">
      Connect. Trade. Grow.
    </p>

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()">
        Login
      </button>

      <button
        id="signupTab"
        class="tab"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="loginEmail"
        type="email"
        required
        placeholder="you@example.com">

      <label>Password</label>

      <input
        id="loginPassword"
        type="password"
        required
        placeholder="Your password">

      <button class="primary-btn">
        Login
      </button>

    </form>

    <form id="signupForm" class="hidden">

      <label>Full Name</label>

      <input
        id="signupName"
        required
        placeholder="Juan Dela Cruz">

      <label>Email</label>

      <input
        id="signupEmail"
        type="email"
        required
        placeholder="you@example.com">

      <label>Password</label>

      <input
        id="signupPassword"
        type="password"
        minlength="8"
        required
        placeholder="Minimum 8 characters">

      <label>Account Type</label>

      <select id="signupRole">

        <option value="BUYER">
          Buyer
        </option>

        <option value="FARMER">
          Farmer
        </option>

        <option value="ORGANIZATION">
          Organization
        </option>

      </select>

      <button class="primary-btn">
        Create Account
      </button>

    </form>

    <div id="authMessage"></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app hidden">

  <nav class="navbar">

    <div class="nav-brand">

      <div class="nav-logo">🌾</div>

      AgriLink AI

    </div>

    <div class="nav-actions">

      <button
        class="secondary-btn"
        onclick="showMarketplace()">
        Marketplace
      </button>

      <button
        class="secondary-btn"
        onclick="showOrders()">
        My Orders
      </button>

      <button
        id="addProductButton"
        class="secondary-btn"
        onclick="openAddProduct()">
        + Add Product
      </button>

      <button
        class="danger-btn"
        onclick="logout()">
        Logout
      </button>

    </div>

  </nav>


  <main class="container">

    <section class="welcome">

      <h1>
        Welcome, <span id="userName">User</span>!
      </h1>

      <p>
        Welcome to your agricultural marketplace.
      </p>

      <div
        id="roleBadge"
        class="role-badge">
      </div>

    </section>


    <!-- MARKETPLACE -->

    <section id="marketplaceSection">

      <div class="section-title">

        <h2>Marketplace</h2>

        <button
          class="secondary-btn"
          onclick="loadProducts()">
          Refresh
        </button>

      </div>

      <div
        id="products"
        class="products">
      </div>

    </section>


    <!-- ORDERS -->

    <section
      id="ordersSection"
      class="hidden">

      <div class="section-title">

        <h2>My Orders</h2>

        <button
          class="secondary-btn"
          onclick="loadOrders()">
          Refresh
        </button>

      </div>

      <div
        id="orders"
        class="orders">
      </div>

    </section>

  </main>

</div>


<!-- =========================
     ADD PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>Add Product</h2>

      <button
        class="close"
        onclick="closeAddProduct()">
        ×
      </button>

    </div>

    <form id="productForm">

      <label>Product Name</label>

      <input
        id="productName"
        required
        placeholder="Fresh Tomatoes">

      <label>Description</label>

      <textarea
        id="productDescription"
        placeholder="Describe your product">
      </textarea>

      <label>Product Image</label>

      <input
        id="productImage"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        required>

      <div
        id="imagePreview"
        class="preview">
        🌱
      </div>

      <label>Price</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        required
        placeholder="80">

      <label>Quantity</label>

      <input
        id="productQuantity"
        type="number"
        min="0"
        step="0.01"
        required
        placeholder="50">

      <label>Unit</label>

      <select id="productUnit">

        <option value="kg">kg</option>
        <option value="piece">piece</option>
        <option value="sack">sack</option>
        <option value="box">box</option>
        <option value="dozen">dozen</option>

      </select>

      <label>Location</label>

      <input
        id="productLocation"
        placeholder="Municipality / Province">

      <button class="primary-btn">
        Publish Product
      </button>

      <div id="productMessage"></div>

    </form>

  </div>

</div>


<!-- =========================
     BUY MODAL
========================= -->

<div
  id="buyModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>Buy Product</h2>

      <button
        class="close"
        onclick="closeBuyModal()">
        ×
      </button>

    </div>

    <div id="buyProductInfo"></div>

    <label>Quantity</label>

    <input
      id="buyQuantity"
      type="number"
      min="0.01"
      step="0.01"
      value="1">

    <div
      id="buyTotal"
      style="margin-top:15px;font-size:18px;font-weight:bold;color:#c62828;">
      Total: ₱0
    </div>

    <button
      class="primary-btn"
      onclick="confirmOrder()">
      Confirm Order
    </button>

    <div id="buyMessage"></div>

  </div>

</div>


<!-- =========================
     AI CHAT
========================= -->

<button
  id="aiButton"
  class="ai-fab hidden"
  onclick="toggleAI()">
  🤖
</button>

<div
  id="aiPanel"
  class="ai-panel hidden">

  <div class="ai-header">

    <strong>AgriBot AI</strong>

    <button
      onclick="toggleAI()"
      style="border:0;background:transparent;color:white;font-size:20px;">
      ×
    </button>

  </div>

  <div
    id="aiMessages"
    class="ai-messages">

    <div class="ai-message ai-bot">
      Hi! I'm AgriBot 🌾 Ask me about farming, products, pricing, or AgriLink.
    </div>

  </div>

  <div class="ai-input">

    <input
      id="aiInput"
      placeholder="Ask AgriBot..."
      onkeydown="if(event.key==='Enter')sendAI()">

    <button onclick="sendAI()">
      Send
    </button>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ivbqudztsmsylnodydce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_J6ofqkb71svrAJr1-mvFIA_hy3RKHrM";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentProfile = null;
let selectedProduct = null;


/* =====================================================
   AUTH TABS
===================================================== */

function showLogin(){

  document
  .getElementById("loginForm")
  .classList.remove("hidden");

  document
  .getElementById("signupForm")
  .classList.add("hidden");

  document
  .getElementById("loginTab")
  .classList.add("active");

  document
  .getElementById("signupTab")
  .classList.remove("active");

}


function showSignup(){

  document
  .getElementById("loginForm")
  .classList.add("hidden");

  document
  .getElementById("signupForm")
  .classList.remove("hidden");

  document
  .getElementById("signupTab")
  .classList.add("active");

  document
  .getElementById("loginTab")
  .classList.remove("active");

}


/* =====================================================
   AUTH MESSAGE
===================================================== */

function showAuthMessage(text,type){

  const box =
  document.getElementById("authMessage");

  box.className =
  "message " + type;

  box.textContent =
  text;

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener("submit",async(event)=>{

  event.preventDefault();

  const email =
  document
  .getElementById("loginEmail")
  .value
  .trim();

  const password =
  document
  .getElementById("loginPassword")
  .value;

  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    showAuthMessage(
      error.message,
      "error"
    );

    return;
  }

  await initializeApp(data.user);

});


/* =====================================================
   SIGN UP
===================================================== */

document
.getElementById("signupForm")
.addEventListener("submit",async(event)=>{

  event.preventDefault();

  const fullName =
  document
  .getElementById("signupName")
  .value
  .trim();

  const email =
  document
  .getElementById("signupEmail")
  .value
  .trim();

  const password =
  document
  .getElementById("signupPassword")
  .value;

  const role =
  document
  .getElementById("signupRole")
  .value;

  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({

    email,
    password,

    options:{
      data:{
        full_name:fullName,
        role:role
      }
    }

  });

  if(error){

    showAuthMessage(
      error.message,
      "error"
    );

    return;
  }

  showAuthMessage(
    "Account created successfully. You can now log in.",
    "success"
  );

  document
  .getElementById("signupForm")
  .reset();

});


/* =====================================================
   INITIALIZE APP
===================================================== */

async function initializeApp(user){

  currentUser =
  user;

  const {
    data:profile,
    error
  } =
  await supabaseClient
  .from("users")
  .select("*")
  .eq("auth_user_id",user.id)
  .single();

  if(error){

    console.error(error);

    alert(
      "Your account exists, but your AgriLink profile could not be loaded."
    );

    return;
  }

  currentProfile =
  profile;

  document
  .getElementById("authScreen")

/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  const container =
  document.getElementById("products");

  container.innerHTML =
  `
  <div class="empty">
    Loading products...
  </div>
  `;

  const {
    data,
    error
  } =
  await supabaseClient
  .from("products")
  .select(`
    id,
    seller_id,
    name,
    description,
    price,
    quantity,
    unit,
    location,
    image_url,
    status,
    created_at
  `)
  .eq("status","ACTIVE")
  .gt("quantity",0)
  .order("created_at",{
    ascending:false
  });

  if(error){

    console.error(error);

    container.innerHTML =
    `
    <div class="empty">
      Unable to load products.
      <br><br>
      ${escapeHtml(error.message)}
    </div>
    `;

    return;
  }

  if(!data || data.length === 0){

    container.innerHTML =
    `
    <div class="empty">
      <h3>No products yet</h3>
      <p style="margin-top:8px;">
        Be the first farmer to publish a product.
      </p>
    </div>
    `;

    return;
  }

  container.innerHTML =
  data.map(product=>{

    const image =
    product.image_url
    ?
    `
    <img
      src="${escapeHtml(product.image_url)}"
      alt="${escapeHtml(product.name)}">
    `
    :
    `🌱`;

    const isOwner =
    currentProfile &&
    product.seller_id === currentProfile.id;

    const canBuy =
    currentProfile &&
    currentProfile.role !== "FARMER" &&
    !isOwner;

    return `
    
    <div class="product-card">

      <div class="product-image">
        ${image}
      </div>

      <div class="product-content">

        <h3>
          ${escapeHtml(product.name)}
        </h3>

        <div class="price">
          ₱${Number(product.price).toLocaleString()}
          / ${escapeHtml(product.unit)}
        </div>

        <p class="product-description">
          ${escapeHtml(
            product.description || "No description"
          )}
        </p>

        <div class="product-quantity">
          📦 Available:
          ${Number(product.quantity).toLocaleString()}
          ${escapeHtml(product.unit)}
        </div>

        <div class="product-location">
          📍
          ${escapeHtml(
            product.location ||
            "Location not specified"
          )}
        </div>

        ${
          canBuy
          ?
          `
          <button
            class="buy-btn"
            onclick="openBuyModal('${product.id}')">
            🛒 Buy Now
          </button>
          `
          :
          ""
        }

        ${
          isOwner
          ?
          `
          <button
            class="delete-btn"
            onclick="deleteProduct('${product.id}')">
            Delete Product
          </button>
          `
          :
          ""
        }

      </div>

    </div>

    `;

  }).join("");

}

/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
.getElementById("productImage")
.addEventListener("change",(event)=>{

  const file =
  event.target.files[0];

  if(!file){

    document
    .getElementById("imagePreview")
    .innerHTML =
    "🌱";

    return;
  }

  if(file.size > 5 * 1024 * 1024){

    alert(
      "Image must be 5MB or smaller."
    );

    event.target.value =
    "";

    return;
  }

  const reader =
  new FileReader();

  reader.onload = ()=>{

    document
    .getElementById("imagePreview")
    .innerHTML =
    `
    <img
      src="${reader.result}"
      alt="Preview">
    `;

  };

  reader.readAsDataURL(file);

});


/* =====================================================
   CREATE PRODUCT
===================================================== */

document
.getElementById("productForm")
.addEventListener("submit",async(event)=>{

  event.preventDefault();

  if(
    !currentUser ||
    !currentProfile ||
    currentProfile.role !== "FARMER"
  ){

    alert(
      "Only farmer accounts can publish products."
    );

    return;
  }

  const file =
  document
  .getElementById("productImage")
  .files[0];

  if(!file){

    alert(
      "Please select a product image."
    );

    return;
  }

  const productName =
  document
  .getElementById("productName")
  .value
  .trim();

  const description =
  document
  .getElementById("productDescription")
  .value
  .trim();

  const price =
  Number(
    document
    .getElementById("productPrice")
    .value
  );

  const quantity =
  Number(
    document
    .getElementById("productQuantity")
    .value
  );

  const unit =
  document
  .getElementById("productUnit")
  .value;

  const location =
  document
  .getElementById("productLocation")
  .value
  .trim();

  if(price <= 0 || quantity <= 0){

    alert(
      "Price and quantity must be greater than zero."
    );

    return;
  }

  const extension =
  file.name
  .split(".")
  .pop()
  .toLowerCase();

  const fileName =
  `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

  const {
    error:uploadError
  } =
  await supabaseClient
  .storage
  .from("product-images")
  .upload(
    fileName,
    file,
    {
      contentType:file.type,
      upsert:false
    }
  );

  if(uploadError){

    console.error(uploadError);

    document
    .getElementById("productMessage")
    .innerHTML =
    `
    <div class="message error">
      Image upload failed:
      ${escapeHtml(uploadError.message)}
    </div>
    `;

    return;
  }

  const {
    data:urlData
  } =
  supabaseClient
  .storage
  .from("product-images")
  .getPublicUrl(fileName);

  const imageUrl =
  urlData.publicUrl;

  const {
    error
  } =
  await supabaseClient
  .from("products")
  .insert({

    seller_id:
    currentProfile.id,

    name:
    productName,

    description:
    description,

    price:
    price,

    quantity:
    quantity,

    unit:
    unit,

    location:
    location,

    image_url:
    imageUrl,

    status:
    "ACTIVE"

  });

  if(error){

    console.error(error);

    document
    .getElementById("productMessage")
    .innerHTML =
    `
    <div class="message error">
      ${escapeHtml(error.message)}
    </div>
    `;

    return;
  }

  document
  .getElementById("productMessage")
  .innerHTML =
  `
  <div class="message success">
    Product published successfully! 🌱
  </div>
  `;

  await loadProducts();

  setTimeout(()=>{
    closeAddProduct();
  },1000);

});

async function openBuyModal(productId){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("products")
  .select("*")
  .eq("id",productId)
  .single();

  if(error){

    alert(error.message);

    return;
  }

  if(!data){

    alert(
      "Product not found."
    );

    return;
  }

  if(Number(data.quantity) <= 0){

    alert(
      "This product is already sold out."
    );

    await loadProducts();

    return;
  }

  if(
    currentProfile &&
    data.seller_id === currentProfile.id
  ){

    alert(
      "You cannot buy your own product."
    );

    return;
  }

  selectedProduct =
  data;

  document
  .getElementById("buyProductInfo")
  .innerHTML =
  `
  <h3>
    ${escapeHtml(data.name)}
  </h3>

  <p style="margin-top:8px;color:#777;">
    ₱${Number(data.price).toLocaleString()}
    / ${escapeHtml(data.unit)}
  </p>

  <p style="margin-top:8px;">
    Available:
    ${Number(data.quantity).toLocaleString()}
    ${escapeHtml(data.unit)}
  </p>
  `;

  const quantityInput =
  document
  .getElementById("buyQuantity");

  quantityInput.max =
  data.quantity;

  quantityInput.value =
  1;

  updateBuyTotal();

  document
  .getElementById("buyMessage")
  .innerHTML =
  "";

  document
  .getElementById("buyModal")
  .classList.remove("hidden");

}


function closeBuyModal(){

  document
  .getElementById("buyModal")
  .classList.add("hidden");

  selectedProduct =
  null;

  document
  .getElementById("buyMessage")
  .innerHTML =
  "";

}


document
.getElementById("buyQuantity")
.addEventListener(
  "input",
  updateBuyTotal
);


function updateBuyTotal(){

  if(!selectedProduct){

    return;
  }

  const quantity =
  Number(
    document
    .getElementById("buyQuantity")
    .value
  );

  const total =
  quantity *
  Number(selectedProduct.price);

  document
  .getElementById("buyTotal")
  .textContent =
  `Total: ₱${total.toLocaleString()}`;

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function confirmOrder(){

  if(
    !currentUser ||
    !currentProfile ||
    !selectedProduct
  ){

    return;
  }

  if(
    currentProfile.role === "FARMER"
  ){

    alert(
      "Farmer accounts cannot purchase products."
    );

    return;
  }

  const quantity =
  Number(
    document
    .getElementById("buyQuantity")
    .value
  );

  if(
    !quantity ||
    quantity <= 0
  ){

    alert(
      "Enter a valid quantity."
    );

    return;
  }

  if(
    quantity >
    Number(selectedProduct.quantity)
  ){

    alert(
      "Not enough stock available."
    );

    return;
  }

  const total =
  quantity *
  Number(selectedProduct.price);

  /*
    IMPORTANT:
    The database should calculate/validate
    the final amount server-side in a
    production version.
  */

  const {
    error:orderError
  } =
  await supabaseClient
  .from("orders")
  .insert({

    product_id:
    selectedProduct.id,

    buyer_id:
    currentProfile.id,

    seller_id:
    selectedProduct.seller_id,

    quantity:
    quantity,

    unit_price:
    selectedProduct.price,

    total_price:
    total,

    status:
    "PENDING"

  });

  if(orderError){

    console.error(orderError);

    document
    .getElementById("buyMessage")
    .innerHTML =
    `
    <div class="message error">
      ${escapeHtml(orderError.message)}
    </div>
    `;

    return;
  }

  /*
    Reduce inventory.
  */

  const remaining =
  Number(selectedProduct.quantity) -
  quantity;

  const newStatus =
  remaining <= 0
  ?
  "SOLD"
  :
  "ACTIVE";

  const {
    error:updateError
  } =
  await supabaseClient
  .from("products")
  .update({

    quantity:
    remaining,

    status:
    newStatus

  })
  .eq(
    "id",
    selectedProduct.id
  )
  .eq(
    "seller_id",
    selectedProduct.seller_id
  );

  if(updateError){

    console.error(updateError);

    document
    .getElementById("buyMessage")
    .innerHTML =
    `
    <div class="message error">
      Order created, but inventory update failed.
      Please contact an administrator.
    </div>
    `;

    return;
  }

  document
  .getElementById("buyMessage")
  .innerHTML =
  `
  <div class="message success">
    Order placed successfully! 🛒
  </div>
  `;

  await loadProducts();

  setTimeout(()=>{

    closeBuyModal();

    showOrders();

  },1000);

}

   ORDERS

function showOrders(){

async function loadOrders(){

  const container =
  document.getElementById("orders");

  container.innerHTML =
  `
  <div class="empty">
    Loading orders...
  </div>
  `;

  if(!currentProfile){

    return;
  }

  /*
    We include buyer_id and seller_id
    because the UI needs to know
    whether this user is the buyer
    or seller.
  */

  const {
    data,
    error
  } =
  await supabaseClient
  .from("orders")
  .select(`
    id,
    buyer_id,
    seller_id,
    product_id,
    quantity,
    unit_price,
    total_price,
    status,
    created_at,
    products(
      name,
      unit,
      image_url
    )
  `)
  .or(
    `buyer_id.eq.${currentProfile.id},seller_id.eq.${currentProfile.id}`
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );

  if(error){

    console.error(error);

    container.innerHTML =
    `
    <div class="empty">
      Unable to load orders.
      <br><br>
      ${escapeHtml(error.message)}
    </div>
    `;

    return;
  }

  if(!data || data.length === 0){

    container.innerHTML =
    `
    <div class="empty">

      <h3>No orders yet</h3>

      <p style="margin-top:8px;">
        Your transactions will appear here.
      </p>

    </div>
    `;

    return;
  }

  container.innerHTML =
  data.map(order=>{

    const isBuyer =
    order.buyer_id ===
    currentProfile.id;

    const product =
    order.products;

    const statusClass =
    getStatusClass(order.status);

    return `
    
    <div class="order-card">

      <div class="order-top">

        <div>

          <div class="order-title">
            ${escapeHtml(
              product?.name ||
              "Product"
            )}
          </div>

          <div class="order-info">
            ${
              isBuyer
              ?
              "You are the buyer"
              :
              "You are the seller"
            }
          </div>

        </div>

        <div
          class="order-status ${statusClass}">
          ${escapeHtml(order.status)}
        </div>

      </div>

      <div class="order-info">
        Quantity:
        ${Number(order.quantity)}
        ${escapeHtml(product?.unit || "")}
      </div>

      <div class="order-info">
        Unit Price:
        ₱${Number(
          order.unit_price
        ).toLocaleString()}
      </div>

      <div class="order-total">
        Total:
        ₱${Number(
          order.total_price
        ).toLocaleString()}
      </div>

      <div class="order-info">
        ${formatDate(order.created_at)}
      </div>

      <div class="order-actions">

        ${
          isBuyer &&
          order.status === "PENDING"
          ?
          `
          <button
            class="cancel-order-btn"
            onclick="cancelOrder('${order.id}')">
            Cancel Order
          </button>
          `
          :
          ""
        }

        ${
          !isBuyer &&
          order.status === "PENDING"
          ?
          `
          <button
            class="accept-btn"
            onclick="updateOrderStatus('${order.id}','ACCEPTED')">
            Accept
          </button>

          <button
            class="reject-btn"
            onclick="updateOrderStatus('${order.id}','REJECTED')">
            Reject
          </button>
          `
          :
          ""
        }

        ${
          !isBuyer &&
          order.status === "ACCEPTED"
          ?
          `
          <button
            class="complete-btn"
            onclick="updateOrderStatus('${order.id}','COMPLETED')">
            Mark Completed
          </button>
          `
          :
          ""
        }

      </div>

    </div>

    `;

  }).join("");

}


/* =====================================================
   ORDER STATUS
===================================================== */

function getStatusClass(status){

  switch(status){

    case "PENDING":
      return "status-pending";

    case "ACCEPTED":
      return "status-accepted";

    case "REJECTED":
      return "status-rejected";

    case "CANCELLED":
      return "status-cancelled";

    case "COMPLETED":
      return "status-completed";

    default:
      return "";

  }

}


/* =====================================================
   UPDATE ORDER
===================================================== */

async function updateOrderStatus(
  orderId,
  newStatus
){

  const confirmed =
  confirm(
    `Change order status to ${newStatus}?`
  );

  if(!confirmed){

    return;
  }

  const {
    data:order,
    error:orderFetchError
  } =
  await supabaseClient
  .from("orders")
  .select("*")
  .eq("id",orderId)
  .single();

  if(orderFetchError){

    alert(
      orderFetchError.message
    );

    return;
  }

  /*
    Only the seller should accept,
    reject, or complete an order.
  */

  if(
    order.seller_id !==
    currentProfile.id
  ){

    alert(
      "You are not authorized to update this order."
    );

    return;
  }

  const {
    error
  } =
  await supabaseClient
  .from("orders")
  .update({
    status:newStatus
  })
  .eq("id",orderId)
  .eq(
    "seller_id",
    currentProfile.id
  );

  if(error){

    alert(
      error.message
    );

    return;
  }

  /*
    If rejected, return stock.
  */

  if(
    newStatus === "REJECTED"
  ){

    await restoreStock(
      order.product_id,
      order.quantity
    );

  }

  alert(
    `Order ${newStatus.toLowerCase()}.`
  );

  await loadOrders();

}


/* =====================================================
   CANCEL ORDER
===================================================== */

async function cancelOrder(
  orderId
){

  const confirmed =
  confirm(
    "Are you sure you want to cancel this order?"
  );

  if(!confirmed){

    return;
  }

  const {
    data:order,
    error
  } =
  await supabaseClient
  .from("orders")
  .select("*")
  .eq("id",orderId)
  .single();

  if(error){

    alert(
      error.message
    );

    return;
  }

  if(
    order.buyer_id !==
    currentProfile.id
  ){

    alert(
      "You cannot cancel this order."
    );

    return;
  }

  if(
    order.status !==
    "PENDING"
  ){

    alert(
      "This order can no longer be cancelled."
    );

    return;
  }

  const {
    error:updateError
  } =
  await supabaseClient
  .from("orders")
  .update({
    status:"CANCELLED"
  })
  .eq("id",orderId)
  .eq(
    "buyer_id",
    currentProfile.id
  );

  if(updateError){

    alert(
      updateError.message
    );

    return;
  }

  await restoreStock(
    order.product_id,
    order.quantity
  );

  alert(
    "Order cancelled successfully."
  );

  await loadOrders();

}


/* =====================================================
   RESTORE STOCK
===================================================== */

async function restoreStock(
  productId,
  quantity
){

  const {
    data:product,
    error
  } =
  await supabaseClient
  .from("products")
  .select(
    "quantity,status"
  )
  .eq("id",productId)
  .single();

  if(error || !product){

    console.error(
      "Unable to restore stock",
      error
    );

    return;
  }

  const restoredQuantity =
  Number(product.quantity) +
  Number(quantity);

  await supabaseClient
  .from("products")
  .update({

    quantity:
    restoredQuantity,

    status:
    "ACTIVE"

  })
  .eq(
    "id",
    productId
  );

}

   DELETE PRODUCT
===================================================== */

async function deleteProduct(

  }

  alert(

  );

}

/* =====================================================
   SECURITY HELPER
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
  date
){

  if(!date){

    return "";

  }

  return new Date(date)
  .toLocaleString();

}

    data.session
  ){

      data.session.user
    );

  }

}
